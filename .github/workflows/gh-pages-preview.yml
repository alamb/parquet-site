# Builds the Hugo site and publishes it to GitHub Pages to preview a fork.
#
# This file is meant to live ONLY on the fork's default branch (main), NOT on a
# feature/PR branch, so it never shows up in an upstream pull request.
#
# Each branch is published into its own directory, so several branches can be
# previewed side by side:
#
#   branch alp-blog   -> https://<user>.github.io/<repo>/alp-blog/
#   branch alamb/foo  -> https://<user>.github.io/<repo>/alamb/foo/
#
# For github.com/alamb/parquet-site that is
# https://alamb.github.io/parquet-site/alp-blog/. The `<repo>` segment is fixed
# by GitHub Pages (a project site is always served from /<repo>/) and cannot be
# moved after the branch name.
#
# https://<user>.github.io/<repo>/ itself serves a generated index listing every
# preview currently published.
#
# One-time setup in your fork:
#   1. Actions tab -> enable workflows (forks disable them by default).
#   2. Settings -> Pages -> Build and deployment -> Source: "Deploy from a
#      branch", branch `gh-pages`, folder `/ (root)`. NOTE: this replaces the
#      previous "GitHub Actions" source; publishing every branch into the same
#      site requires accumulating files on a branch, which the GitHub Actions
#      source cannot do (each deployment there replaces the whole site).
#
# To preview a branch:
#   Actions -> "Preview on GitHub Pages" -> Run workflow, and pick/enter the
#   branch to build in the "ref" box. The workflow itself runs from `main`
#   (where this file lives) but checks out and builds the branch you name.
#
# Previews are never removed automatically. To drop one, delete its directory
# and its line in previews.txt on the `gh-pages` branch.

name: Preview on GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to build and preview (published to /<branch>/)"
        default: "alamb/update_v2"
        required: true

# Needed to push the built site to the `gh-pages` branch.
permissions:
  contents: write

# Serialize runs: every branch publishes to the same `gh-pages` branch, so two
# concurrent runs would race on the push. Don't cancel an in-progress one.
concurrency:
  group: "gh-pages-preview"
  cancel-in-progress: false

env:
  PUBLISH_BRANCH: gh-pages
  # Root-level file on PUBLISH_BRANCH listing the slug of every published
  # preview, one per line. Used to regenerate the index page.
  MANIFEST: previews.txt

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve preview slug and base URL
        id: target
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          slug="${INPUT_REF#refs/heads/}"
          # The slug becomes a directory path on the publish branch, so reject
          # anything that could escape it or produce a malformed URL.
          case "$slug" in
            ""|/*|*/|*..*|*\\*|*" "*)
              echo "::error::Refusing to publish ref '${INPUT_REF}': not a usable directory name"
              exit 1
              ;;
          esac
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
          echo "base_url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${slug}/" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          submodules: recursive   # needed for the assets/parquet-format submodule
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.152.0'
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Build
        # baseURL puts the site under /<repo>/<branch>/ so links and assets
        # resolve within this branch's directory.
        #
        # canonifyURLs additionally rewrites root-relative URLs written inside
        # content (e.g. <img src="/blog/alp/foo.png"> in a blog post) to absolute
        # URLs under baseURL. Hugo does not rewrite those on its own, so without
        # this they resolve to https://<user>.github.io/blog/... and 404 on the
        # preview. The production site is served at the domain root, so it does
        # not need this.
        env:
          HUGO_CANONIFYURLS: "true"
        run: hugo --minify --baseURL "${{ steps.target.outputs.base_url }}"

      - name: Publish preview
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: ${{ env.PUBLISH_BRANCH }}
          destination_dir: ${{ steps.target.outputs.slug }}
          # Preserve the other branches' preview directories.
          keep_files: true
          commit_message: "Preview ${{ steps.target.outputs.slug }}"

      - name: Check out publish branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLISH_BRANCH }}
          path: publish-branch

      - name: Regenerate preview index
        env:
          SLUG: ${{ steps.target.outputs.slug }}
        run: |
          set -euo pipefail
          mkdir -p site-index
          # Record this preview, then rebuild the listing from the manifest.
          # `keep_files` never deletes, so the manifest is the only record of
          # what has been published.
          if [ -f "publish-branch/${MANIFEST}" ]; then
            cp "publish-branch/${MANIFEST}" site-index/"${MANIFEST}"
          else
            : > site-index/"${MANIFEST}"
          fi
          printf '%s\n' "${SLUG}" >> site-index/"${MANIFEST}"
          sort -u -o site-index/"${MANIFEST}" site-index/"${MANIFEST}"

          {
            echo '<!DOCTYPE html>'
            echo '<html lang="en"><head><meta charset="utf-8">'
            echo '<title>parquet-site branch previews</title>'
            echo '<style>body{font-family:system-ui,sans-serif;margin:3rem auto;max-width:44rem;padding:0 1rem}li{margin:.4rem 0}</style>'
            echo '</head><body>'
            echo '<h1>parquet-site branch previews</h1>'
            echo '<p>Each entry is a Hugo build of one branch of this fork.</p>'
            echo '<ul>'
            while IFS= read -r s; do
              [ -n "$s" ] || continue
              # Slugs come from branch names, so escape HTML metacharacters.
              esc=$(printf '%s' "$s" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g')
              printf '<li><a href="%s/">%s</a></li>\n' "$esc" "$esc"
            done < site-index/"${MANIFEST}"
            echo '</ul>'
            echo '</body></html>'
          } > site-index/index.html

          # Keep Pages from running the published output through Jekyll.
          : > site-index/.nojekyll

      - name: Publish preview index
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site-index
          publish_branch: ${{ env.PUBLISH_BRANCH }}
          keep_files: true
          commit_message: "Index: add ${{ steps.target.outputs.slug }}"

      - name: Summary
        run: |
          echo "Preview published: ${{ steps.target.outputs.base_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All previews: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_STEP_SUMMARY"
